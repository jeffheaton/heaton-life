name: Build Library

# The Python library build, the same shape as dynaface's build-lib.yml: lint and
# type reports (advisory), the test suite (fatal; it replays the conformance
# vectors and drives the playground offscreen), a regenerated build stamp, then
# the wheel → twine check → workflow artifact → S3. Publishing to PyPI is the
# separate, manually dispatched deploy-lib.yml, fed from that S3 copy.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION.

on:
  workflow_dispatch:

permissions:
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build wheel

      - name: Qt system libraries (the playground tests run offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install dependencies
        working-directory: python
        run: pip install -e ".[dev,playground]"

      - name: Static code analysis
        working-directory: python
        run: |

          echo "Running ruff (lint)..."
          ruff check src tests tools --output-format=full > ruff-report.txt || true

          echo "Checking formatting with ruff..."
          ruff format --check src tests tools > ruff-format-report.txt 2>&1 || true

          echo "Running mypy..."
          mypy --show-error-codes --no-color-output --no-error-summary > mypy-report.txt || true

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          retention-days: 7
          path: python/*.txt
          if-no-files-found: ignore

      - name: Run tests
        working-directory: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3.11 -m pytest tests \
            --junitxml=unit_test_results.xml \
            --cov=heaton_life \
            --cov-report=xml:coverage.xml \
            --cov-report=html

      - name: Check coverage thresholds
        working-directory: python
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3.11 -m pytest tests --cov=heaton_life --cov-fail-under=60 -q --no-header 2>&1 | tail -5

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: python/unit_test_results.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          retention-days: 7
          path: |
            python/coverage.xml
            python/htmlcov/
          if-no-files-found: ignore

      # pyproject.toml is the version's source of truth; __version__ must agree
      # (the literal is what users read at runtime), and version.py carries the
      # build stamp into the wheel. A tracked baseline (BUILD 0) means "local build".
      - name: Generate version file
        working-directory: python
        run: |
          VERSION=$(python3.11 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          INIT_VERSION=$(python3.11 -c "import heaton_life; print(heaton_life.__version__)")
          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "pyproject.toml says $VERSION but heaton_life.__version__ is $INIT_VERSION — bump both."
            exit 1
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S%z")
          BUILD="${{ github.run_number }}"

          cat <<EOF > src/heaton_life/version.py
          """Build stamp — regenerated by the Build Library workflow; BUILD 0 means a local build."""

          VERSION = "$VERSION"
          BUILD_DATE = "$BUILD_DATE"
          BUILD = $BUILD
          EOF

          echo "Generated src/heaton_life/version.py:"
          cat src/heaton_life/version.py

      - name: Build wheel
        working-directory: python
        run: |
          rm -rf dist/*
          python3.11 -m build --wheel

      - name: Validate with twine
        working-directory: python
        run: |
          # packaging>=24.2: the wheel carries Metadata-Version 2.4 (PEP 639
          # License-File), which the runner's system packaging does not recognize.
          pip install --upgrade twine "packaging>=24.2"
          twine check dist/*

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: heaton-life-wheel
          retention-days: 7
          path: python/dist/*.whl

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          cd python/dist
          aws s3 cp *.whl s3://data.heatonresearch.com/library/ --acl public-read

      - name: Clean up build artifacts
        if: always()
        working-directory: python
        run: rm -rf build dist src/*.egg-info
