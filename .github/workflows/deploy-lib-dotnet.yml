name: Deploy Library to NuGet (.NET)

# Publishes the HeatonLife.Core package that a Build Library (.NET) run staged
# on S3, by version, and tags v<version> at the commit it was built from.
# Nothing is rebuilt: what is published is exactly what was built and tested.
# Mirrors deploy-lib.yml (the Python package to PyPI), which tags the same
# v<version>, so the two packages of one version must come from one commit.
#
# NuGet.org is reached by Trusted Publishing: the policy "heaton-life-dotnet"
# on the jeffheaton account, bound to jeffheaton/heaton-life and this workflow
# file -- see RELEASING.md.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION (to read
# the staged files).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to deploy (e.g., 1.2.0); deploys HeatonLife.Core.<version>.nupkg and its .snupkg'
        required: true

permissions:
  # Creates the release tag.
  contents: write
  # Required for NuGet Trusted Publishing: lets the NuGet/login action request a
  # short-lived OIDC token from GitHub to exchange for a temporary NuGet API key.
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download packages from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a package version (e.g., 1.2.0)."
            exit 1
          fi
          mkdir -p nupkgs
          for file in "HeatonLife.Core.$VERSION.nupkg" "HeatonLife.Core.$VERSION.snupkg"; do
            echo "Downloading $file from S3..."
            aws s3 cp "s3://data.heatonresearch.com/library/$file" nupkgs/ || {
              echo "::error::$file is not staged. Run Build Library (.NET) at this version first."
              exit 1
            }
          done
          ls -l nupkgs
          mkdir -p record
          aws s3 cp "s3://data.heatonresearch.com/library/HeatonLife.Core-$VERSION-build.json" record/ || {
            echo "::error::No build record for $VERSION is staged. Run Build Library (.NET) at this version first."
            exit 1
          }

      # The tag records what was released: the commit this package was built
      # from, read from the build record. A tag already standing elsewhere is
      # refused before anything is published. gh api prints a 404's body to
      # stdout even with --jq, so a missing tag is told by its exit status and
      # "HTTP 404" on stderr, and any other failure stops the deploy.
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          RECORD: record/HeatonLife.Core-${{ github.event.inputs.version }}-build.json
        run: |
          COMMIT=$(jq -er .commit "$RECORD")
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The build record names no commit: '$COMMIT'."
            exit 1
          fi
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" \
                     --jq '.object.type + " " + .object.sha' 2> gh-error.txt); then
            sha=${ref#* }
            # An annotated tag points at a tag object; peel it to the commit.
            if [ "${ref% *}" = tag ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
            fi
            if [ "$sha" != "$COMMIT" ]; then
              echo "::error::v$VERSION already points at $sha, not $COMMIT, the commit this build came from."
              exit 1
            fi
            echo "v$VERSION is already at $COMMIT"
            echo "TAGGED=true" >> "$GITHUB_ENV"
          elif grep -q "HTTP 404" gh-error.txt; then
            echo "v$VERSION is not tagged yet; it will be, at $COMMIT"
            echo "TAGGED=false" >> "$GITHUB_ENV"
          else
            cat gh-error.txt
            echo "::error::Could not read the tag v$VERSION."
            exit 1
          fi

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Trusted Publishing: exchange GitHub's OIDC token for a short-lived NuGet
      # API key (no long-lived secret stored in the repo).
      - name: NuGet login (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jeffheaton

      # The .nupkg push carries the .snupkg along only when the main push
      # succeeds, so the symbols are pushed explicitly as well: a rerun then
      # recovers symbols even if the package already exists (both pushes are
      # no-ops at an already-published version thanks to --skip-duplicate).
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "nupkgs/*.snupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag the release
        if: env.TAGGED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$COMMIT" > /dev/null
          echo "Tagged v$VERSION at $COMMIT"
