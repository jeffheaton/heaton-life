name: Build Library (.NET)

# The .NET library build, the same shape as dynaface's build-lib-dotnet.yml:
# formatting gate, vulnerability report (advisory), a regenerated build stamp,
# Release build, the xunit suite (it replays the conformance vectors), then the
# DLL zip → workflow artifact → S3, and the NuGet package → NuGet.org through
# Trusted Publishing. Re-running at an already-published version is a no-op
# (--skip-duplicate), so the S3/artifact half is always safe to rerun.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION.
# NuGet.org: a Trusted Publishing policy under the jeffheaton account, bound to
# jeffheaton/heaton-life and this workflow file (see dotnet/DEVELOPMENT.md, "Releasing").

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  # Required for NuGet Trusted Publishing: lets the NuGet/login action request a
  # short-lived OIDC token from GitHub to exchange for a temporary NuGet API key.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: dotnet
        run: dotnet restore HeatonLife.slnx

      - name: Check formatting
        working-directory: dotnet
        run: dotnet format HeatonLife.slnx --verify-no-changes --report format-report

      - name: Upload formatting report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-report
          retention-days: 7
          path: dotnet/format-report
          if-no-files-found: ignore

      # HeatonLife.Core itself has zero package dependencies; the test project
      # (xunit and friends) is the only place a vulnerable package could enter.
      - name: Check for vulnerable packages
        working-directory: dotnet
        continue-on-error: true
        run: dotnet list tests/HeatonLife.Core.Tests/HeatonLife.Core.Tests.csproj package --vulnerable --include-transitive | tee vulnerable-packages-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report
          retention-days: 7
          path: dotnet/vulnerable-packages-report.txt
          if-no-files-found: ignore

      # <Version> in the csproj is the source of truth. Version.cs is tracked as a
      # baseline (Build 0 = local build) so the class always exists; CI overwrites it.
      - name: Generate version file
        working-directory: dotnet
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/HeatonLife.Core/HeatonLife.Core.csproj)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S%z")
          BUILD="${{ github.run_number }}"

          cat <<EOF > src/HeatonLife.Core/Version.cs
          // Build stamp — regenerated by the Build Library (.NET) workflow; Build 0 means a local build.
          namespace HeatonLife
          {
              /// <summary>Version and build stamp of this HeatonLife.Core assembly.</summary>
              public static class HeatonLifeVersion
              {
                  public const string Version = "$VERSION";
                  public const string BuildDate = "$BUILD_DATE";
                  public const int Build = $BUILD;
              }
          }
          EOF

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Generated src/HeatonLife.Core/Version.cs:"
          cat src/HeatonLife.Core/Version.cs

      - name: Build (Release)
        working-directory: dotnet
        run: dotnet build HeatonLife.slnx -c Release --no-restore -p:Version=$VERSION -p:ContinuousIntegrationBuild=true

      - name: Run tests
        working-directory: dotnet
        run: |
          dotnet test tests/HeatonLife.Core.Tests/HeatonLife.Core.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET Test Results
          path: dotnet/TestResults/*.trx
          reporter: dotnet-trx

      - name: Package library artifact
        working-directory: dotnet
        run: |
          mkdir -p dist
          cp src/HeatonLife.Core/bin/Release/netstandard2.1/HeatonLife.Core.dll dist/
          cp src/HeatonLife.Core/bin/Release/netstandard2.1/HeatonLife.Core.xml dist/
          cp src/HeatonLife.Core/bin/Release/netstandard2.1/HeatonLife.Core.pdb dist/ 2>/dev/null || true
          cd dist && zip -r "../heaton-life-dotnet-${VERSION}.zip" .

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: heaton-life-dotnet-dll
          retention-days: 7
          path: dotnet/heaton-life-dotnet-*.zip

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws s3 cp dotnet/heaton-life-dotnet-${VERSION}.zip s3://data.heatonresearch.com/library/ --acl public-read

      - name: Pack NuGet package (HeatonLife.Core)
        working-directory: dotnet
        run: |
          dotnet pack src/HeatonLife.Core/HeatonLife.Core.csproj -c Release --no-build \
            -p:Version=$VERSION -o nupkgs
          ls -l nupkgs

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: heaton-life-nupkgs
          retention-days: 7
          path: |
            dotnet/nupkgs/*.nupkg
            dotnet/nupkgs/*.snupkg

      # Trusted Publishing: exchange GitHub's OIDC token for a short-lived NuGet
      # API key (no long-lived secret stored in the repo). Requires a matching
      # trusted-publishing policy on NuGet.org — see dotnet/DEVELOPMENT.md, "Releasing".
      - name: NuGet login (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jeffheaton

      # The .nupkg push carries the .snupkg along only when the main push succeeds,
      # so the symbols package is pushed explicitly as well: a rerun then recovers
      # symbols even if the main package already exists (both pushes are no-ops at
      # an already-published version thanks to --skip-duplicate).
      - name: Push to NuGet.org
        working-directory: dotnet
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "nupkgs/*.snupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Clean up build artifacts
        if: always()
        working-directory: dotnet
        run: rm -rf dist nupkgs TestResults format-report src/HeatonLife.Core/bin src/HeatonLife.Core/obj tests/HeatonLife.Core.Tests/bin tests/HeatonLife.Core.Tests/obj
