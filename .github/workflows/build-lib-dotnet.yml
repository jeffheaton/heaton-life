name: Build Library (.NET)

# Builds the C# library for a release, by hand, under the release convention
# (~/.claude/CLAUDE.md): a check that the version agrees everywhere it ships,
# the formatting gate, a vulnerable-packages report, a version file stamped
# with this build's date and number, the Release build and the xunit suite over
# it (it replays the conformance vectors), then the DLL zip and the NuGet
# package with its symbols, staged as artifacts and on S3 beside a build record
# naming the commit. Rerun it at the same version as often as needed; each run
# replaces what is staged. Publishing to NuGet.org is a separate, manual step:
# Deploy Library to NuGet (.NET) (deploy-lib-dotnet.yml). RELEASING.md has the
# whole sequence.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION.
on:
  workflow_dispatch:

permissions:
  contents: read
  # The test reporter publishes the xunit results as a check.
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The README (with its zip link) is frozen into the immutable .nupkg, and
      # this workflow runs no Python, so python/tests/test_release_version.py
      # never sees a NuGet-only build: check the places it can drift here,
      # before anything builds.
      - name: Check the version agrees with pyproject and the README
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/src/HeatonLife.Core/HeatonLife.Core.csproj | head -1)
          PYTHON=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -1)
          LINKS=$(grep -o "heaton-life-dotnet-${VERSION}\.zip" dotnet/README.md | wc -l)
          if [ "$PYTHON" != "$VERSION" ] || [ "$LINKS" -ne 2 ]; then
            echo "::error::csproj says $VERSION, pyproject.toml says $PYTHON, and dotnet/README.md names heaton-life-dotnet-$VERSION.zip $LINKS times (want 2)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building HeatonLife.Core $VERSION"

      - name: Restore
        run: dotnet restore dotnet/HeatonLife.slnx

      - name: Check formatting
        run: dotnet format dotnet/HeatonLife.slnx --verify-no-changes --report format-report

      - name: Upload formatting report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-report
          retention-days: 7
          path: format-report
          if-no-files-found: ignore

      # HeatonLife.Core itself has zero package dependencies; the test project
      # (xunit and friends) is the only place a vulnerable package could enter.
      - name: Check for vulnerable packages
        continue-on-error: true
        run: dotnet list dotnet/tests/HeatonLife.Core.Tests/HeatonLife.Core.Tests.csproj package --vulnerable --include-transitive | tee vulnerable-packages-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report
          retention-days: 7
          path: vulnerable-packages-report.txt
          if-no-files-found: ignore

      # The tracked Version.cs is the baseline (Build 0 means a local build);
      # this run's stamp goes into the DLL.
      - name: Generate version file
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD="${{ github.run_number }}"

          cat <<EOF > dotnet/src/HeatonLife.Core/Version.cs
          // Build stamp — regenerated by the Build Library (.NET) workflow; Build 0 means a local build.
          namespace HeatonLife
          {
              /// <summary>Version and build stamp of this HeatonLife.Core assembly.</summary>
              public static class HeatonLifeVersion
              {
                  public const string Version = "$VERSION";
                  public const string BuildDate = "$BUILD_DATE";
                  public const int Build = $BUILD;
              }
          }
          EOF

          echo "Generated dotnet/src/HeatonLife.Core/Version.cs:"
          cat dotnet/src/HeatonLife.Core/Version.cs

      # ContinuousIntegrationBuild maps the PDB's source paths to /_/ and Source
      # Link points them at this commit on GitHub, for a reproducible package.
      - name: Build (Release)
        run: dotnet build dotnet/HeatonLife.slnx -c Release --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: |
          dotnet test dotnet/tests/HeatonLife.Core.Tests/HeatonLife.Core.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Package library artifact
        run: |
          mkdir -p dist
          out=dotnet/src/HeatonLife.Core/bin/Release/netstandard2.1
          cp "$out/HeatonLife.Core.dll" "$out/HeatonLife.Core.pdb" "$out/HeatonLife.Core.xml" dist/
          cp LICENSE dist/
          cd dist && zip -r "../heaton-life-dotnet-${VERSION}.zip" .

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: heaton-life-dotnet-dll
          retention-days: 7
          path: heaton-life-dotnet-*.zip

      # dotnet/README.md links this zip, so it is public from here on: the
      # bucket grants public read itself. Never treat a staged build as secret.
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: aws s3 cp "heaton-life-dotnet-${VERSION}.zip" s3://data.heatonresearch.com/library/ --acl public-read

      # The .nupkg (DLL, IntelliSense XML, README, icon) and its .snupkg of
      # symbols, Source Link pointing them at this commit on GitHub.
      - name: Pack NuGet package
        run: |
          dotnet pack dotnet/src/HeatonLife.Core/HeatonLife.Core.csproj -c Release --no-build \
            -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -o nupkgs
          ls -l nupkgs

      # What deploy-lib-dotnet.yml tags: the commit this package was built from.
      - name: Record the build
        run: |
          cat > "nupkgs/HeatonLife.Core-$VERSION-build.json" <<EOF
          {
            "name": "HeatonLife.Core",
            "version": "$VERSION",
            "commit": "$GITHUB_SHA",
            "run_id": $GITHUB_RUN_ID,
            "run_number": $GITHUB_RUN_NUMBER,
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat "nupkgs/HeatonLife.Core-$VERSION-build.json"

      - name: Upload NuGet packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: heaton-life-nupkgs
          retention-days: 7
          path: nupkgs/*

      # Staged where Deploy Library to NuGet (.NET) looks for them, by version.
      - name: Upload NuGet packages to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          for f in nupkgs/*; do
            aws s3 cp "$f" s3://data.heatonresearch.com/library/ --acl public-read
          done

      - name: Clean up build artifacts
        if: always()
        run: rm -rf dist nupkgs TestResults format-report dotnet/src/HeatonLife.Core/bin dotnet/src/HeatonLife.Core/obj dotnet/tests/HeatonLife.Core.Tests/bin dotnet/tests/HeatonLife.Core.Tests/obj
