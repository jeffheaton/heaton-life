name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries (for PyQt6 offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install
        run: pip install -e ".[dev,playground]"
      - name: Lint
        run: ruff check src tests tools
      - name: Types
        run: mypy
      - name: Tests (includes conformance vectors + offscreen playground)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
