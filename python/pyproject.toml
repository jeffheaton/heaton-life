[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heaton-life"
version = "0.0.1"
description = "Emergence algorithms: cellular automata, Lenia, fractals, boids, and reaction-diffusion."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jeff Heaton" }]
keywords = ["cellular-automata", "lenia", "fractals", "boids", "reaction-diffusion", "mergelife", "emergence", "artificial-life"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "mpmath>=1.3",  # deep-zoom reference orbits (pure-Python fallback; gmpy2 extra is the fast path)
]

[project.urls]
Repository = "https://github.com/jeffheaton/heaton-life"

[project.optional-dependencies]
playground = ["PyQt6>=6.6"]
precision = ["gmpy2>=2.1"]   # fast deep-zoom reference orbits; mpmath fallback is built in
video = ["imageio[ffmpeg]>=2.31"]
fast = ["numba>=0.59"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "gmpy2>=2.1"]

[project.gui-scripts]
heaton-life = "heaton_life.playground:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heaton_life"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (evolver runs)"]

[tool.mypy]
strict = true
packages = ["heaton_life"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["gmpy2", "mpmath"]
ignore_missing_imports = true
