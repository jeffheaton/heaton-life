[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heaton-life"
version = "1.0.0"
description = "Explore emergence in Python: cellular automata (MergeLife, Life-like, Elementary, Cyclic, Wireworld), Lenia, deep-zoom fractals, boids, and Gray-Scott reaction-diffusion under one deterministic API, rendered to images, GIFs, and MP4s, with a MergeLife evolver and a PyQt6 playground."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Heaton", email = "jeff@jeffheaton.com" }]
keywords = ["cellular-automata", "lenia", "fractals", "boids", "reaction-diffusion", "mergelife", "emergence", "artificial-life"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "mpmath>=1.3",  # deep-zoom reference orbits (pure-Python fallback; gmpy2 extra is the fast path)
]

[project.urls]
Homepage = "https://github.com/jeffheaton/heaton-life"
Documentation = "https://github.com/jeffheaton/heaton-life/blob/main/python/README.md"
Specifications = "https://github.com/jeffheaton/heaton-life/tree/main/spec"
Source = "https://github.com/jeffheaton/heaton-life"
"Bug Tracker" = "https://github.com/jeffheaton/heaton-life/issues"

[project.optional-dependencies]
playground = ["PyQt6>=6.6"]
precision = ["gmpy2>=2.1"]   # fast deep-zoom reference orbits; mpmath fallback is built in
video = ["imageio[ffmpeg]>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "gmpy2>=2.1"]

[project.gui-scripts]
heaton-life = "heaton_life.playground:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heaton_life"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (evolver runs)"]

[tool.mypy]
strict = true
packages = ["heaton_life"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["gmpy2", "mpmath"]
ignore_missing_imports = true
